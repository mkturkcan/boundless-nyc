; BoundlessUE: renderer settings for the takes (ue_take.py). Lumen GI and reflections, Nanite, virtual shadow maps,
; MegaLights for the street lamps, hardware ray tracing on Vulkan SM6 (override per run with
; -ini:Engine:[/Script/Engine.RendererSettings]:r.RayTracing=False when a GPU or driver lacks it).

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/Engine.RendererSettings]
r.Nanite.ProjectEnabled=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.RayTracing=True
r.RayTracing.Shadows=False
r.Lumen.HardwareRayTracing=True
; R3-REFL: Lumen reflections on the front layer of translucency (the window kit's glass)
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=1
r.Lumen.TraceMeshSDFs=1
r.MegaLights.EnableForProject=True
r.SkinCache.CompileShaders=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=1.0
r.DefaultFeature.LocalExposure.ShadowContrastScale=1.0
r.CustomDepth=3
r.VirtualTextures=False
r.SupportSkyAtmosphere=True
r.Substrate=False

[/Script/Engine.Engine]
NearClipPlane=10.0
bSmoothFrameRate=False

[/Script/UnrealEd.CookerSettings]
bCookOnTheFlyForLaunchOn=False

[DevOptions.Shaders]
NumUnusedShaderCompilingThreads=4

[/Script/Engine.StreamingSettings]
s.AsyncLoadingThreadEnabled=True
